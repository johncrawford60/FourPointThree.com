<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FourPointThree</title>
<meta name="description" content="Coming soon: a new approach to IPv4 networking solutions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0e1116;
    color: #e6e8eb;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    display: flex;
    align-items: center;
    padding: 0 24px;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  h1 {
    font-family: "IBM Plex Sans", Helvetica, Arial, sans-serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 8vw, 4.5rem);
    letter-spacing: -0.03em;
    line-height: 1;
    margin: 0 0 24px;
  }
  p {
    font-size: 0.95rem;
    line-height: 1.6;
    color: #8b949e;
    margin: 0 0 40px;
    max-width: 46ch;
  }
  a.contact {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #e6e8eb;
    text-decoration: none;
    border: 1px solid #e6e8eb;
    padding: 12px 22px;
    transition: background 0.15s, color 0.15s;
  }
  a.contact:hover, a.contact:focus-visible {
    background: #e6e8eb;
    color: #0e1116;
    outline: none;
  }
</style>
</head>
<body>
<main>
  <h1>FourPointThree</h1>
  <p>Coming Soon: A New Approach to IPv4 Networking Solutions</p>
  <a class="contact" href="mailto:john@fourpointthree.com">Contact</a>
</main>
</body>
</html>
