<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FourPointThree</title>
<meta name="description" content="A new approach to IPv4 networking solutions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0B2D6B;
    color: #FFFFFF;
    font-family: "Barlow Semi Condensed", "DIN Condensed", "Arial Narrow", sans-serif;
    display: flex;
    align-items: center;
    padding: 0 24px;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  h1 {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: clamp(16px, 4vw, 32px);
    margin: 0 0 32px;
    font-weight: 600;
    font-size: clamp(2.2rem, 8vw, 3.9rem);
    letter-spacing: 0.02em;
    line-height: 1;
  }
  h1 svg {
    width: clamp(96px, 24vw, 168px);
    height: auto;
    flex: none;
  }
  h1 span { display: block; }
  p {
    font-size: 1.15rem;
    line-height: 1.5;
    color: #B6C2DB;
    margin: 0 0 40px;
    max-width: 46ch;
  }
  a.contact {
    display: inline-block;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #FFFFFF;
    text-decoration: none;
    border: 2px solid #FFFFFF;
    padding: 12px 24px;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  a.contact:hover, a.contact:focus-visible {
    background: #E4002B;
    border-color: #E4002B;
    color: #FFFFFF;
    outline: none;
  }
</style>
</head>
<body>
<main>
  <h1>
    <svg viewBox="-24 -24 288 288" role="img" aria-label="FourPointThree logo">
      <g fill="none" stroke-linejoin="miter">
        <rect x="-15" y="-15" width="270" height="270" stroke="#FFFFFF" stroke-width="15"/>
        <path d="M15,225v-30h30v30h30h30v-30h-30v-30h30v-30h-30h-30v30h-30v-30v-30h30v-30h-30v-30v-30h30v30h30v-30h30v30v30h-30v30h30h30h30v-30h-30v-30v-30h30v30h30v-30h30v30v30h-30v30h30v30v30h-30v-30h-30h-30v30h30v30h-30v30h30h30v-30h30v30" stroke="#FFFFFF" stroke-width="15" stroke-linecap="square"/>
        <path d="M180,135h-15h-30v30h30v15" stroke="#FF4A3D" stroke-width="15"/>
      </g>
    </svg>
    <span><span>FOUR POINT</span><span>THREE</span></span>
  </h1>
  <p>A New Approach to IPv4 Networking Solutions</p>
  <a class="contact" href="mailto:john@fourpointthree.com">Contact</a>
</main>
</body>
</html>
